name: Build and Test

on:
  pull_request:
    branches: [main]

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timing-stress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build azclips.slnx --configuration Debug

      - name: Run Agent and Recovery tests 20 times
        run: |
          failures=0
          for i in $(seq 1 20); do
            echo "::group::Iteration $i"
            dotnet test Agent/tests/Core.Agent.Tests/Core.Agent.Tests.csproj --no-build --configuration Debug --filter "Category!=LocalOnly" --logger "console;verbosity=minimal" || { failures=$((failures+1)); echo "::error::Agent tests failed in iteration $i"; }
            dotnet test tests/Cli.Tests/Cli.Tests.csproj --no-build --configuration Debug --filter "FullyQualifiedName~Cli.Tests.Recovery&Category!=LocalOnly" --logger "console;verbosity=minimal" || { failures=$((failures+1)); echo "::error::Recovery tests failed in iteration $i"; }
            echo "::endgroup::"
          done
          echo "Failed runs: $failures"
          test "$failures" -eq 0
